<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Dinner Ticket</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap');

:root{
  --paper: #F4EFE4;
  --paper-dark: #E8E0CE;
  --ink: #232019;
  --ink-soft: #5A5245;
  --stamp-red: #B23A2C;
  --ready-green: #4A7856;
  --line: #C7BCA5;
}

*{ box-sizing: border-box; }

body{
  margin:0;
  background: transparent;
  font-family: 'Inter', sans-serif;
  color: var(--ink);
  display:flex;
  justify-content:center;
  padding: 24px 12px;
}

.ticket{
  width: 100%;
  max-width: 420px;
  background: var(--paper);
  position: relative;
  padding: 28px 26px 30px;
  box-shadow: 0 18px 40px rgba(35,32,25,0.18);
  background-image:
    repeating-linear-gradient(180deg, rgba(35,32,25,0.025) 0px, rgba(35,32,25,0.025) 1px, transparent 1px, transparent 26px);
}

.perf{
  position:absolute;
  left:0; right:0;
  height:12px;
  background:
    radial-gradient(circle, transparent 5px, var(--paper) 5.5px) 0 50% / 20px 20px repeat-x;
}
.perf.top{ top:-6px; }
.perf.bottom{ bottom:-6px; transform: rotate(180deg); }

.hole{
  position:absolute;
  top:18px; left:18px;
  width:8px; height:8px;
  border-radius:50%;
  background: transparent;
  box-shadow: 0 0 0 999px var(--paper);
}

.header{
  text-align:center;
  border-bottom: 2px dashed var(--line);
  padding-bottom: 14px;
  margin-bottom: 16px;
}
.eyebrow{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--ink-soft);
  margin-bottom: 4px;
}
.title{
  font-family: 'Bebas Neue', sans-serif;
  font-size: 44px;
  line-height: 0.9;
  letter-spacing: 1px;
  margin: 2px 0 6px;
}
.subtitle{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11.5px;
  color: var(--ink-soft);
}

.section-label{
  font-family:'IBM Plex Mono', monospace;
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--stamp-red);
  margin: 18px 0 8px;
  display:flex;
  align-items:center;
  gap:8px;
}
.section-label::after{
  content:'';
  flex:1;
  border-bottom: 1px dotted var(--line);
}

.chip-grid{
  display:flex;
  flex-wrap:wrap;
  gap: 8px;
}
.chip{
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 8px 13px;
  border: 1.5px solid var(--ink);
  background: transparent;
  color: var(--ink);
  cursor:pointer;
  transition: all 0.15s ease;
  border-radius: 2px;
}
.chip:hover{ background: rgba(35,32,25,0.06); }
.chip.selected{
  background: var(--ink);
  color: var(--paper);
}

.custom-row{
  display:flex;
  gap:8px;
  margin-top:10px;
}
.custom-row input{
  flex:1;
  font-family:'IBM Plex Mono', monospace;
  font-size: 13px;
  padding: 8px 10px;
  border: 1.5px solid var(--line);
  background: var(--paper-dark);
  color: var(--ink);
  border-radius:2px;
}
.custom-row input:focus{ outline: none; border-color: var(--ink); }

.loc-row{
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--paper-dark);
  border-left: 3px solid var(--ready-green);
  min-height: 16px;
}
.loc-row.pending{ border-left-color: var(--stamp-red); }
.loc-row button{
  background:none;
  border:none;
  text-decoration: underline;
  font-family: inherit;
  font-size: inherit;
  color: var(--ink);
  cursor:pointer;
  padding:0;
  margin-left: 6px;
}

.totals{
  border-top: 2px dashed var(--line);
  margin-top: 20px;
  padding-top: 14px;
  font-family:'IBM Plex Mono', monospace;
  font-size: 12px;
  color: var(--ink-soft);
  display:flex;
  justify-content: space-between;
}

.send-btn{
  width:100%;
  margin-top: 18px;
  padding: 15px;
  background: var(--stamp-red);
  color: var(--paper);
  border: none;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  letter-spacing: 3px;
  cursor: pointer;
  border-radius: 2px;
  transform: rotate(-0.4deg);
  transition: transform 0.15s ease, background 0.15s ease;
}
.send-btn:hover{ transform: rotate(0deg) scale(1.01); background: #9A3125; }
.send-btn:disabled{ background: var(--line); color: var(--ink-soft); cursor: not-allowed; transform:none; }

.stamp{
  position:absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%) rotate(-12deg);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 46px;
  letter-spacing: 6px;
  color: var(--ready-green);
  border: 5px solid var(--ready-green);
  padding: 6px 22px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease, transform 0.3s ease;
  background: rgba(244,239,228,0.85);
}
.stamp.show{
  opacity: 1;
  transform: translate(-50%,-50%) rotate(-12deg) scale(1);
}

.foot-note{
  text-align:center;
  font-family:'IBM Plex Mono', monospace;
  font-size: 10.5px;
  color: var(--ink-soft);
  margin-top: 14px;
  letter-spacing: 1px;
}
</style>
</head>
<body>

<div class="ticket" id="ticket">
  <div class="perf top"></div>

  <div class="header">
    <div class="eyebrow">TONIGHT'S PICK · TABLE FOR YOU</div>
    <div class="title">DINNER TICKET</div>
    <div class="subtitle" id="dateline"></div>
  </div>

  <div class="section-label">CRAVING</div>
  <div class="chip-grid" id="cuisineGrid">
    <button class="chip" data-val="Italian">Italian</button>
    <button class="chip" data-val="Mexican">Mexican</button>
    <button class="chip" data-val="Sushi">Sushi</button>
    <button class="chip" data-val="Thai">Thai</button>
    <button class="chip" data-val="Burgers">Burgers</button>
    <button class="chip" data-val="Pizza">Pizza</button>
    <button class="chip" data-val="Indian">Indian</button>
    <button class="chip" data-val="BBQ">BBQ</button>
    <button class="chip" data-val="Ramen">Ramen</button>
    <button class="chip" data-val="Surprise me">Surprise Me</button>
  </div>
  <div class="custom-row">
    <input type="text" id="customCuisine" placeholder="or type your own craving...">
  </div>

  <div class="section-label">HOW FAR</div>
  <div class="chip-grid" id="distGrid">
    <button class="chip" data-val="walking distance">Walk</button>
    <button class="chip" data-val="a short drive (under 15 min)">Short Drive</button>
    <button class="chip" data-val="anywhere worth it">Anywhere Worth It</button>
  </div>

  <div class="section-label">LOCATION</div>
  <div class="loc-row pending" id="locStatus">
    finding your table... <button id="retryLoc">retry</button>
  </div>

  <div class="totals">
    <span id="itemCount">0 items selected</span>
    <span id="readyState">not ready</span>
  </div>

  <button class="send-btn" id="sendBtn" disabled>FIND MY SPOT →</button>

  <div class="foot-note">Claude will search real restaurants once this ticket's punched</div>

  <div class="stamp" id="stamp">PUNCHED</div>
  <div class="perf bottom"></div>
</div>

<script>
let selectedCuisine = null;
let selectedDist = null;
let coords = null;
let locText = "your area";

const dateline = document.getElementById('dateline');
dateline.textContent = new Date().toLocaleDateString('en-US', { weekday:'long', month:'short', day:'numeric' }).toUpperCase();

function setupChips(gridId, onSelect){
  const grid = document.getElementById(gridId);
  grid.querySelectorAll('.chip').forEach(chip=>{
    chip.addEventListener('click', ()=>{
      grid.querySelectorAll('.chip').forEach(c=>c.classList.remove('selected'));
      chip.classList.add('selected');
      onSelect(chip.dataset.val);
    });
  });
}

setupChips('cuisineGrid', (val)=>{
  selectedCuisine = val;
  document.getElementById('customCuisine').value = '';
  updateState();
});

setupChips('distGrid', (val)=>{
  selectedDist = val;
  updateState();
});

document.getElementById('customCuisine').addEventListener('input', (e)=>{
  if(e.target.value.trim()){
    document.querySelectorAll('#cuisineGrid .chip').forEach(c=>c.classList.remove('selected'));
    selectedCuisine = e.target.value.trim();
  } else {
    selectedCuisine = null;
  }
  updateState();
});

function updateState(){
  const count = (selectedCuisine?1:0) + (selectedDist?1:0);
  document.getElementById('itemCount').textContent = count + ' item' + (count===1?'':'s') + ' selected';
  const ready = selectedCuisine && selectedDist;
  document.getElementById('readyState').textContent = ready ? 'ready to fire' : 'not ready';
  document.getElementById('sendBtn').disabled = !ready;
}

function locateUser(){
  const locStatus = document.getElementById('locStatus');
  locStatus.classList.add('pending');
  locStatus.innerHTML = 'finding your table... <button id="retryLoc">retry</button>';
  document.getElementById('retryLoc').addEventListener('click', locateUser);

  if(!navigator.geolocation){
    locText = "your area (location unavailable)";
    locStatus.innerHTML = 'location unavailable — will search generally <button id="retryLoc">retry</button>';
    document.getElementById('retryLoc').addEventListener('click', locateUser);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos)=>{
      coords = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      locText = `coordinates ${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}`;
      locStatus.classList.remove('pending');
      locStatus.innerHTML = `table located ✓ (${coords.lat.toFixed(3)}, ${coords.lng.toFixed(3)}) <button id="retryLoc">refresh</button>`;
      document.getElementById('retryLoc').addEventListener('click', locateUser);
    },
    (err)=>{
      locText = "your area (location permission denied — please mention your city)";
      locStatus.innerHTML = 'permission denied — I\\'ll ask you to name your area <button id="retryLoc">retry</button>';
      document.getElementById('retryLoc').addEventListener('click', locateUser);
    }
  );
}
locateUser();

document.getElementById('sendBtn').addEventListener('click', ()=>{
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.textContent = 'SEARCHING...';
  document.getElementById('stamp').classList.add('show');

  const msg = `Help me pick a ${selectedCuisine} restaurant for dinner, ${selectedDist}, near ${locText}. Find real nearby options and show them on the map with your recommendation.`;

  setTimeout(()=>{
    if(window.sendPrompt){
      window.sendPrompt(msg);
    }
    btn.textContent = 'TICKET PUNCHED ✓';
  }, 500);
});
</script>

</body>
</html>
