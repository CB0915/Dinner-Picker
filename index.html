<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Dinner Ticket</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="ticket" id="ticket">
  <div class="perf top"></div>

  <div class="header">
    <div class="eyebrow">TONIGHT'S PICK · TABLE FOR YOU</div>
    <div class="title">DINNER TICKET</div>
    <div class="subtitle" id="dateline"></div>
  </div>

  <div class="section-label">CRAVING (pick one or more)</div>
  <div class="chip-grid" id="cuisineGrid">
    <button type="button" class="chip" data-val="italian">Italian</button>
    <button type="button" class="chip" data-val="mexican">Mexican</button>
    <button type="button" class="chip" data-val="sushi">Sushi</button>
    <button type="button" class="chip" data-val="thai">Thai</button>
    <button type="button" class="chip" data-val="burger">Burgers</button>
    <button type="button" class="chip" data-val="pizza">Pizza</button>
    <button type="button" class="chip" data-val="indian">Indian</button>
    <button type="button" class="chip" data-val="bbq">BBQ</button>
    <button type="button" class="chip" data-val="ramen">Ramen</button>
    <button type="button" class="chip" data-val="">Surprise Me</button>
  </div>
  <div class="custom-row">
    <input type="text" id="customCuisine" placeholder="or type your own craving...">
  </div>

  <div style="text-align:center; margin-top:12px;">
    <button type="button" class="chip" id="cravingWheelToggleBtn" style="width:100%; background:transparent; color:var(--ready-green); border-color:var(--ready-green); padding:10px;">🎡 CAN'T DECIDE? SPIN FOR A CRAVING</button>
    <div id="cravingWheelWrapper" style="display:none;">
      <div style="font-family:'IBM Plex Mono', monospace; font-size:9.5px; letter-spacing:1.5px; color:var(--ready-green); text-align:center; margin-top:14px;">PICKING A CRAVING</div>
      <div id="cravingWheelArea" style="margin-top:6px; display:flex; justify-content:center;"></div>
      <button type="button" class="chip" id="cravingSpinBtn" style="width:100%; background:var(--ready-green); color:var(--paper); border-color:var(--ready-green); padding:10px; margin-top:10px;">🎡 SPIN</button>
      <div class="status-msg" id="cravingWheelResult" style="display:none;" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div class="section-label">HOW FAR</div>
  <div class="chip-grid" id="distGrid">
    <button type="button" class="chip" data-val="850">Walk (~10 min)</button>
    <button type="button" class="chip" data-val="13000">Short Drive (15-20 min)</button>
    <button type="button" class="chip" data-val="20000">Anywhere Worth It</button>
  </div>

  <div class="section-label">LOCATION</div>
  <div class="loc-row pending" id="locStatus">
    finding your table... <button id="retryLoc">retry</button>
  </div>

  <div class="totals">
    <span id="itemCount">0 items selected</span>
    <span id="readyState">not ready</span>
  </div>

  <button type="button" class="send-btn" id="sendBtn" disabled>FIND MY SPOT →</button>

  <div id="resultsArea"></div>

  <div class="foot-note">Powered by OpenStreetMap · free, no account needed</div>
  <div style="text-align:center; margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; justify-content:center;">
    <button type="button" class="small-btn" id="manageExcludedBtn" aria-label="Manage excluded restaurants">⚙️ EXCLUDED (0)</button>
    <button type="button" class="small-btn" id="manageBlocklistBtn" aria-label="Manage always-skip chains">🚫 ALWAYS SKIP (0)</button>
    <button type="button" class="small-btn active" id="soundToggleBtn" aria-label="Toggle wheel sound" aria-pressed="true">🔊 SOUND ON</button>
    <button type="button" class="small-btn" id="darkModeToggleBtn" aria-label="Toggle dark mode" aria-pressed="false">🌙 DARK MODE</button>
  </div>
  <div id="excludedPanel" class="manage-panel" style="display:none;" role="region" aria-label="Excluded restaurants"></div>
  <div id="blocklistPanel" class="manage-panel" style="display:none;" role="region" aria-label="Always-skip chains"></div>
  <div class="perf bottom"></div>
</div>

<script src="script.js"></script>

</body>
</html>
